<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arc">
<meta name="theme-color" content="#0d0d0f">
<title>Arc</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230d0d0f'/%3E%3Cpath d='M4 18C7.5 6 16.5 6 20 18' fill='none' stroke='%23ffb84d' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#0d0d0f;--s1:#161619;--s2:#202024;--s3:#2c2c32;--hair:rgba(255,255,255,.07);--txt:#f4f4f5;--dim:#8f8f97;--faint:#5e5e66;--acc:#ffb84d;--onacc:#1d1406;--pos:#7fd48a;--neg:#f0846f;
 --hdw:102px;--tab:54px;--sb:env(safe-area-inset-bottom);--sl:env(safe-area-inset-left);--sr:env(safe-area-inset-right);--st:env(safe-area-inset-top);
 --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;padding:0}
button:disabled{cursor:default}
button:active:not(:disabled){opacity:.7}
svg{flex:none;display:block}
/* en-tête */
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:58px;padding:calc(var(--st) + 8px) calc(var(--sr) + 12px) 10px calc(var(--sl) + 18px);background:rgba(13,13,15,.86);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border-bottom:1px solid var(--hair)}
.logo{margin-right:2px}
.ht{flex:1;min-width:0}
.ht b{display:block;font:700 20px/1.2 var(--round);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht small{display:block;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.icb{flex:none;width:42px;height:42px;border-radius:21px;border:0;background:var(--s2);display:grid;place-items:center}
.icb.on{color:var(--acc)}
.vbar{order:9;flex:0 0 100%;padding-top:8px;display:flex;align-items:center;gap:8px}
.vbar .grow{flex:1}
.verchip{height:34px;padding:0 10px 0 13px;border-radius:17px;border:0;background:var(--s2);display:inline-flex;align-items:center;gap:7px;font-size:13px}
.verchip b{font-weight:600}
.verchip span{color:var(--dim);font-variant-numeric:tabular-nums}
.verchip svg{color:var(--faint)}
/* onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;padding:0 var(--sr) var(--sb) var(--sl);background:rgba(13,13,15,.9);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--hair)}
.tab{flex:1;height:var(--tab);background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--faint)}
.tab.on{color:var(--txt)}
.tab.on svg{color:var(--acc)}
.tab:disabled{opacity:.35}
main{max-width:720px;margin:0 auto;padding:6px var(--sr) calc(var(--tab) + var(--sb) + 28px) var(--sl)}
.v-setup main{padding-bottom:calc(var(--tab) + var(--sb) + 100px)}
.v-arrange main{max-width:none;padding-top:0;padding-bottom:calc(var(--tab) + var(--sb) + 96px)}
/* blocs et contrôles */
.blk{padding:0 18px;margin:22px 0 0}
.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--dim)}
.lbl em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400;color:var(--faint)}
.seg{display:flex;background:var(--s1);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:40px;border:0;background:none;border-radius:9px;color:var(--dim);font-size:14px;font-weight:500}
.seg button.on{background:var(--s3);color:var(--txt);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.seg button small{display:block;font-size:11px;font-weight:400;color:var(--faint);margin-top:1px}
.seg button.on small{color:var(--dim)}
.seg.tall button{min-height:50px}
.seg.sm{flex:none;padding:2px;border-radius:10px}
.seg.sm button{flex:none;min-height:30px;padding:0 13px;font-size:13px;border-radius:8px}
.scroller{display:flex;gap:8px;overflow-x:auto;margin:12px -18px 0;padding:0 18px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:18px;border:1px solid var(--hair);background:none;color:var(--dim);font-size:14px;white-space:nowrap}
.chip.on{background:var(--txt);border-color:var(--txt);color:var(--bg);font-weight:600}
.togs{display:flex;flex-wrap:wrap;gap:8px}
.tog{height:38px;padding:0 15px 0 12px;border-radius:19px;border:1px solid var(--hair);background:none;color:var(--faint);display:inline-flex;align-items:center;gap:8px;font-size:14px}
.tog i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor}
.tog.on{background:var(--s2);border-color:transparent;color:var(--txt)}
.tog.on i{background:var(--c);box-shadow:none}
.tempo{display:flex;align-items:center;justify-content:space-between;background:var(--s1);border-radius:16px;padding:7px}
.tempo button{width:54px;height:54px;border-radius:12px;border:0;background:var(--s2);display:grid;place-items:center}
.tempo label{display:flex;align-items:baseline;justify-content:center;gap:6px}
.tempo input{width:76px;background:none;border:0;padding:0;color:var(--txt);font:700 34px/1 var(--round);text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield;outline:none}
.tempo input::-webkit-inner-spin-button{-webkit-appearance:none}
.tempo label span{color:var(--dim);font-size:14px;font-weight:500}
.cta{position:fixed;left:0;right:0;bottom:calc(var(--tab) + var(--sb));z-index:25;max-width:720px;margin:0 auto;padding:18px calc(18px + var(--sr)) 12px calc(18px + var(--sl));background:linear-gradient(to bottom,rgba(13,13,15,0),var(--bg) 45%)}
.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border:0;border-radius:16px;background:var(--acc);color:var(--onacc);font:700 17px var(--round);box-shadow:0 8px 24px rgba(255,184,77,.18)}
.ghostbtn{height:42px;padding:0 16px;border-radius:21px;border:0;background:var(--s2);display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px}
/* grille */
.grid{overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;margin-top:6px;border-bottom:1px solid var(--hair);scrollbar-width:none}
.grid::-webkit-scrollbar{display:none}
.gin{position:relative}
.row{display:flex}
.hd{position:sticky;left:0;z-index:4;width:var(--hdw);flex:0 0 var(--hdw);background:var(--bg);border-right:1px solid var(--hair);padding:0 6px 0 calc(12px + var(--sl));display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);overflow:hidden}
.hd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd i{width:6px;height:6px;border-radius:50%;flex:none}
.lane{position:relative;flex:none;background-image:repeating-linear-gradient(to right,rgba(255,255,255,.04) 0 1px,transparent 1px calc(var(--bw) * 4))}
.z-lo .lane{background-image:repeating-linear-gradient(to right,rgba(255,255,255,.04) 0 1px,transparent 1px calc(var(--bw) * 16))}
.r-ruler .lane,.r-ruler .hd{height:30px}
.r-ruler .lane{background:none}
.fitb{width:34px;height:24px;border-radius:7px;border:0;background:var(--s2);color:var(--dim);display:grid;place-items:center}
.mk{position:absolute;top:9px;font:500 10px/14px var(--round);color:var(--faint);padding-left:3px;border-left:1px solid rgba(255,255,255,.12);height:14px;font-variant-numeric:tabular-nums}
.z-mid .mk:not(.m8),.z-lo .mk:not(.m16){display:none}
.r-sec .lane,.r-sec .hd{height:32px}
.sec{position:absolute;top:4px;bottom:4px;border-radius:6px;overflow:hidden;font:600 11px/24px var(--round);padding:0 6px;white-space:nowrap}
.sec.sel{color:#fff!important;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.idot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--acc);margin-left:5px;vertical-align:2px}
.r-energy .lane,.r-energy .hd{height:42px}
.r-trk .lane,.r-trk .hd{height:var(--rh,25px)}
.r-trk .reg{top:calc(var(--rh,25px) * .16);bottom:calc(var(--rh,25px) * .16)}
.reg{position:absolute;top:4px;bottom:4px;border-radius:4px;display:flex;align-items:center;padding:0 5px;font:600 10px/1 var(--round);white-space:nowrap;overflow:hidden;color:transparent}
.grid.zlbl .reg{color:var(--tc)}
.r-energy .hd small{margin-left:auto;font:600 11px var(--round);color:var(--acc);font-variant-numeric:tabular-nums}
.selcol{position:absolute;top:30px;bottom:0;background:rgba(255,255,255,.045);pointer-events:none;z-index:1}
.playhead{position:absolute;top:30px;bottom:0;width:2px;margin-left:-1px;border-radius:1px;background:var(--acc);pointer-events:none;z-index:3;box-shadow:0 0 6px rgba(255,184,77,.6)}
/* Simple : aperçu du morceau + cartes de sections */
.v-arrange.m-simple main{padding-bottom:calc(var(--tab) + var(--sb) + 28px)}
.v-arrange.m-simple .toast{bottom:calc(var(--tab) + var(--sb) + 16px)}
.ov{position:sticky;top:var(--hh,0px);z-index:10;background:rgba(13,13,15,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:14px calc(18px + var(--sr)) 10px calc(18px + var(--sl));border-bottom:1px solid var(--hair)}
.ovsvg{display:block;width:100%;height:36px}
.ovbar{display:flex;gap:2px;height:26px;margin-top:-1px}
.ovs{border:0;min-width:3px;border-radius:3px;transition:background .2s}
.ovs:first-child{border-radius:8px 3px 3px 8px}
.ovs:last-child{border-radius:3px 8px 8px 3px}
.ovs.on{box-shadow:0 0 0 1.5px var(--bg),0 0 0 3px rgba(255,255,255,.85);position:relative;z-index:1}
.ovt{display:flex;justify-content:space-between;margin-top:7px;font:500 11px var(--round);color:var(--faint);font-variant-numeric:tabular-nums}
.scl{max-width:720px;margin:0 auto;padding:10px calc(10px + var(--sr)) 0 calc(10px + var(--sl))}
.sc{border-radius:18px;transition:background .2s}
.sc.open{background:var(--s1);margin:6px 0}
.sch{display:flex;align-items:center;gap:13px;width:100%;border:0;background:none;padding:13px 12px;text-align:left}
.scc{width:4px;align-self:stretch;border-radius:2px;flex:none}
.scm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sct{display:flex;align-items:center;gap:8px;font:700 17px/1.25 var(--round)}
.sct>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sct em,.sname em{flex:none;font:600 10px/1 -apple-system,sans-serif;font-style:normal;text-transform:uppercase;letter-spacing:.6px;color:var(--acc);border:1px solid rgba(255,184,77,.4);border-radius:5px;padding:3px 5px}
.sct .idot{margin-left:0}
.scs{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px;margin-top:7px}
.dots i{width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.13)}
.dots i[style]{box-shadow:none}
.meter{display:flex;align-items:flex-end;gap:3px;flex:none;padding-right:2px}
.meter i{width:4px;border-radius:2px;background:var(--s3)}
.meter i.on{background:var(--acc)}
.scd{padding:0 16px 16px 29px;animation:fin .28s ease}
@keyframes fin{from{opacity:0;transform:translateY(-6px)}}
.sdl{margin:6px 0 8px;font-size:11px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--faint)}
.scd .chg+.sdl,.scd .idea+.sdl,.scd .muted+.sdl{margin-top:18px}
.muted{margin:0;color:var(--dim);font-size:14px}
.sph{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:4px 0}
.sph span{font:600 13px/1.5 var(--round);color:var(--faint);font-variant-numeric:tabular-nums}
.sph p{margin:0;font-size:14px;line-height:1.5}
.sph .up{color:var(--acc)}
.sfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--hair);color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
/* Créer, mode simple : résumé des réglages experts */
.sumrow{display:flex;align-items:center;gap:10px;width:100%;padding:14px 14px 14px 16px;border:0;border-radius:16px;background:var(--s1);text-align:left}
.sumrow span{flex:1;min-width:0}
.sumrow b{display:block;font:600 15px var(--round)}
.sumrow small{display:block;color:var(--dim);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sumrow em{font-style:normal;color:var(--acc);font-size:13px;font-weight:600;white-space:nowrap}
.sumrow svg{color:var(--faint)}
/* menu qui monte du bas */
.modal.msheet{align-items:flex-end;padding:0;animation:fade .2s ease}
.modal.msheet.out{opacity:0;transition:opacity .2s}
@keyframes fade{from{opacity:0}}
.menu{width:100%;max-width:520px;background:var(--s1);border-radius:24px 24px 0 0;padding:8px 12px calc(14px + var(--sb));animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(100%)}}
.mgrab{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:2px auto 12px}
.menu h4{margin:0 12px 8px;font:700 18px var(--round)}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:13px 12px;border:0;background:none;border-radius:14px;text-align:left}
.mi>span{flex:1;min-width:0}
.mi b{display:block;font:600 16px var(--round)}
.mi small{color:var(--dim);font-size:13px}
.mi em{font:600 17px var(--round);font-style:normal;color:var(--dim);font-variant-numeric:tabular-nums}
.mi.on{background:var(--s2)}
.mi.on em{color:var(--txt)}
.mi svg{color:var(--acc)}
.mi>i{width:20px;flex:none}
/* tiroir de section */
.sheet{position:fixed;left:0;right:0;bottom:calc(var(--tab) + var(--sb));z-index:25;max-width:720px;margin:0 auto;background:rgba(27,27,31,.97);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--hair);border-radius:20px 20px 0 0;box-shadow:0 -14px 34px rgba(0,0,0,.55);padding:0 calc(8px + var(--sr)) 6px calc(8px + var(--sl))}
.grab{height:16px;touch-action:none}
.grab span{display:block;width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:7px auto 0}
.shead{display:flex;align-items:center;gap:4px;touch-action:none}
.nav{width:46px;height:46px;border-radius:23px;border:0;background:none;display:grid;place-items:center;flex:none}
.nav:disabled{color:var(--faint);opacity:.5}
.sinfo{flex:1;min-width:0;border:0;background:none;padding:2px 0 4px;display:flex;flex-direction:column;align-items:center}
.sname{display:flex;align-items:center;gap:8px;max-width:100%;font:700 18px/1.25 var(--round)}
.sname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sname i{width:9px;height:9px;border-radius:3px;flex:none}
.sname em{font:600 10px/1 -apple-system,sans-serif;font-style:normal;text-transform:uppercase;letter-spacing:.6px;color:var(--acc);border:1px solid rgba(255,184,77,.4);border-radius:5px;padding:3px 5px;flex:none}
.smeta{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.smeta svg{transition:transform .25s;color:var(--faint)}
.open .smeta svg{transform:rotate(180deg)}
.more{max-height:0;overflow:hidden;transition:max-height .3s ease}
.open .more{max-height:calc(70vh - 110px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.lenrow{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 6px;color:var(--dim);font-size:14px}
.len{display:flex;align-items:center;background:var(--s2);border-radius:12px}
.len button{width:44px;height:40px;border:0;background:none;display:grid;place-items:center}
.len b{min-width:96px;text-align:center;font:600 15px var(--round);color:var(--txt);font-variant-numeric:tabular-nums}
.idea{display:flex;gap:10px;margin:8px 0 2px;padding:12px 14px;border-radius:14px;background:rgba(255,184,77,.08);color:#f3d9ad;font-size:14px}
.idea svg{color:var(--acc);margin-top:1px}
.more .lbl{margin:18px 8px 4px}
.ph{display:grid;grid-template-columns:56px 1fr;gap:8px;padding:11px 8px;border-radius:12px}
.ph.on{background:rgba(255,184,77,.07)}
.pr{font:600 13px/1.45 var(--round);color:var(--faint);font-variant-numeric:tabular-nums}
.ph.on .pr{color:var(--acc)}
.pn{font-weight:600;margin-bottom:5px}
.pn .up{color:var(--acc);font-weight:700}
.chg{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:13px}
.ch{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.ch i{width:6px;height:6px;border-radius:50%}
.ch b{font-weight:700;width:9px;text-align:center}
.ch b.pos{color:var(--pos)}
.ch b.neg{color:var(--neg)}
.ch em{font-style:normal;color:var(--dim)}
/* sauvegardes */
.list{margin:14px 18px 0;background:var(--s1);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:stretch}
.item+.item{border-top:1px solid var(--hair)}
.iopen{flex:1;min-width:0;text-align:left;background:none;border:0;padding:14px 16px}
.iopen b{display:flex;align-items:center;gap:8px;font:600 16px var(--round)}
.iopen b span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iopen b em{flex:none;font:600 10px/1 -apple-system,sans-serif;font-style:normal;text-transform:uppercase;letter-spacing:.6px;color:var(--acc);border:1px solid rgba(255,184,77,.4);border-radius:5px;padding:3px 5px}
.iopen small{display:block;color:var(--dim);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idel{width:54px;background:none;border:0;color:var(--faint);display:grid;place-items:center}
.empty{color:var(--dim);text-align:center;padding:64px 24px;display:flex;flex-direction:column;align-items:center;gap:4px}
.empty>svg{color:var(--faint);margin-bottom:10px}
.empty p{margin:2px 0}
.empty .ghostbtn{margin-top:20px;color:var(--txt)}
/* toasts et dialogue */
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--sb) + 16px);transform:translateX(-50%);display:flex;align-items:center;gap:14px;width:max-content;max-width:calc(100vw - 32px);background:var(--s3);color:var(--txt);padding:11px 18px;border-radius:14px;font-size:14px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:opacity .3s}
.v-setup .toast{bottom:calc(var(--tab) + var(--sb) + 86px)}
.v-arrange .toast{bottom:calc(var(--tab) + var(--sb) + 96px)}
.toast button{flex:none;background:none;border:0;color:var(--acc);font-weight:700}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:flex-start;padding:calc(var(--st) + 90px) 16px 16px}
.dlg{width:100%;max-width:420px;background:var(--s1);border-radius:20px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.dlg h4{margin:0 0 12px;font:700 18px var(--round)}
.dlg input{width:100%;height:48px;padding:0 14px;border-radius:12px;border:0;background:var(--s2);color:var(--txt);font:inherit;font-size:17px;outline:none}
.dlg input:focus{box-shadow:0 0 0 2px rgba(255,184,77,.5)}
.dlgb{display:flex;gap:10px;margin-top:14px}
.dlgb button{flex:1;height:48px;border-radius:14px;border:0;background:var(--s2);font:600 16px var(--round)}

 .v-arrange main{padding-bottom:calc(var(--tab) + var(--sb) + 84px)}
 .sheet{max-width:none}
 .open .more{max-height:calc(100vh - 190px)}
}

function hash(...a){let h=2166136261>>>0;const s=a.join('|');for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}h^=h>>>15;h=Math.imul(h,2246822507)>>>0;h^=h>>>13;return (h>>>0)/4294967296;}
function lvParse(str){const o={};str.replace(/([a-z])(\d)/g,(m,e,n)=>{o[e]=+n;return m;});return o;}
function recipe(fam,type){return (R[fam]&&R[fam][type])||R.house[type]||R.disco[type]||R.soul[type];}

function alloc(spec,N){
 let it=spec.map(p=>({fx:p[0][0]==='='?+p[0].slice(1):0,w:p[0][0]==='*'?(+p[0].slice(1)||1):0,lv:p[1],note:p[2]||'',up:!!p[3]}));
 const sumF=()=>it.reduce((a,i)=>a+i.fx,0),flex=()=>it.filter(i=>!i.fx);
 while(it.length>1){const R=N-sumF(),fl=flex().length;if(R>=0&&R>=fl)break;const k=it.findIndex(i=>i.fx);it.splice(k>=0?k:0,1);}
 if(it.length===1){it[0].bars=N;}
 else{
  const F=sumF(),Rm=N-F,fl=flex();
  it.forEach(i=>{if(i.fx)i.bars=i.fx;});
  if(fl.length){
   const u=Rm>=4*fl.length?4:Rm>=2*fl.length?2:1,units=Math.floor(Rm/u),W=fl.reduce((a,i)=>a+i.w,0);
   fl.forEach(i=>i.un=Math.max(1,Math.floor(units*i.w/W)));
   let s=fl.reduce((a,i)=>a+i.un,0),j=fl.length-1;
   while(s<units){fl[j].un++;s++;j=(j-1+fl.length)%fl.length;}
   while(s>units){const m=fl.reduce((a,i)=>i.un>a.un?i:a);m.un--;s--;}
   fl.forEach(i=>i.bars=i.un*u);fl[fl.length-1].bars+=Rm-units*u;
  }else it[it.length-1].bars+=Rm;
 }
 return it.filter(i=>i.bars>0).map(i=>({bars:i.bars,lv:lvParse(i.lv),note:i.note,up:i.up}));
}

function phrasesOf(song,s){
 const vars=recipe(song.style,s.type);
 let avail=vars.map((v,i)=>i).filter(i=>{const n=vars[i].n;return !n||[...n].every(e=>song.el[e]);});
 if(!avail.length)avail=[0];
 let vi=avail[Math.floor(hash(song.seed,s.type,0)*avail.length)];
 for(let j=1;j<=s.k;j++)if(hash(song.seed,s.type,j,'c')>0.6)vi=avail[Math.floor(hash(song.seed,s.type,j)*avail.length)];
 const v=vars[vi],ph=alloc(v.p||v,s.bars);
 ph.forEach(p=>{for(const e in p.lv)if(!song.el[e]||!EL[e])delete p.lv[e];});
 return ph;
}

function loopTypeOf(fam,t,seq){
 const map={main:['drop','chorus'],verse:fam==='house'?['groove','verse']:['verse','groove'],break:['break','bridge']};
 const c=map[t];if(!c)return null;return c.find(x=>seq.some(s=>s.type===x))||null;
}
function parseSeq(str,fmt){
 return str.split(' ').filter(t=>{const c=t[0];if(c==='+')return fmt==='extended';if(c==='~')return fmt!=='radio';if(c==='!')return fmt==='radio';return true;})
  .map(t=>{const m=t.match(/([a-z]+)(\d+)/);return {type:m[1],bars:+m[2],o:+m[2]};});
}
function poolOf(song){
 let p=TPL[song.style].filter(t=>!t.v||song.el.v);if(!p.length)p=TPL[song.style];
 if(song.loop&&song.loop.type!=='none'){const q=p.filter(t=>loopTypeOf(song.style,song.loop.type,parseSeq(t.s,'extended')));if(q.length)p=q;}

}
function tplOf(song){const p=poolOf(song);return p[Math.floor(hash(song.seed,'tpl')*p.length)];}

function hintOf(song,e){const f=song.flavor&&FLAV[song.flavor];return (f&&f.h[e])||FAM[song.style].h[e]||DEF_HINT[e]||'';}
function titleOf(song){return FAM[song.style].n+(song.flavor&&FLAV[song.flavor]?' · '+FLAV[song.flavor].n:'');}

function buildVersion(song,fmt){
 const fam=song.style;
 const seq=parseSeq(tplOf(song).s,fmt);
 const target=Math.round((fam==='soul'?TARGET_SOUL:TARGET)[fmt]*song.bpm/4);
 const step=fam==='soul'?4:8,min=fam==='soul'?4:8;
 // on rallonge surtout grooves / intro / outro ; on ne raccourcit jamais couplets, refrains ni drops (la durée reste une estimation)
 const pick=list=>{const c=[];list.forEach(t=>seq.forEach((s,i)=>{if(s.type===t)c.push(i);}));return c;};
 const grow=pick(PRI[fam]),shrink=pick(['intro','outro','break','groove','vamp','solo']);
 let total=seq.reduce((a,s)=>a+s.bars,0),gi=Math.floor(hash(song.seed,'ci')*Math.max(1,grow.length)),si=0,guard=0,fails=0;
 while(guard++<80){
  const diff=target-total;
  if(diff>0){if(diff<=step/2||!grow.length)break;const idx=grow[gi++%grow.length];seq[idx].bars+=step;total+=step;}
  else{if(total<=target*1.12||!shrink.length||fails>shrink.length)break;const idx=shrink[si++%shrink.length];
   if(seq[idx].bars-step>=Math.max(min,seq[idx].o/2)){seq[idx].bars-=step;total-=step;fails=0;}else fails++;}
 }
 const lt=song.loop&&song.loop.type!=='none'?loopTypeOf(fam,song.loop.type,seq):null;
 if(lt){const L=song.loop.len;seq.forEach(s=>{if(s.type===lt){s.loop=true;s.bars=Math.max(L,Math.round(s.bars/L)*L);}});}
 const cnt={};seq.forEach(s=>{delete s.o;s.k=cnt[s.type]=(cnt[s.type]===undefined?0:cnt[s.type]+1);});
 return {sections:seq};
}

function timeline(song,ver){
 let start=0;
 const secs=ver.sections.map((s,i)=>{const ph=phrasesOf(song,s);let b=start;ph.forEach(p=>{p.start=b;b+=p.bars;});const o=Object.assign({},s,{i,start,phrases:ph});start+=s.bars;return o;});
 const tot={},cnt={};secs.forEach(s=>tot[s.type]=(tot[s.type]||0)+1);
 secs.forEach(s=>{cnt[s.type]=(cnt[s.type]||0)+1;s.name=SEC[s.type].n+(tot[s.type]>1?' '+cnt[s.type]:'');});
 const W=ORDER.filter(e=>song.el[e]).reduce((a,e)=>a+EL[e].w,0)||1;
 const energy=[],barInfo=[];
 secs.forEach(s=>s.phrases.forEach((p,pi)=>{
  let e=0;for(const k in p.lv)e+=EL[k].w*p.lv[k]/3;e/=W;
  for(let j=0;j<p.bars;j++){let v=e;if(p.up)v=e*(0.55+0.45*(p.bars>1?j/(p.bars-1):1));energy.push(Math.min(1,v));barInfo.push({s:s.i,p:pi});}
 }));
 const n={radio:1,standard:2,extended:3}[song.fmt]||2;
 ideasOf(song).map((x,i)=>({t:x[0],x:x[1],r:hash(song.seed,'idea',song.fmt,i)}))
  .filter(o=>secs.some(s=>s.type===o.t)).sort((a,b)=>a.r-b.r).slice(0,n)
  .forEach(o=>{const c=secs.filter(s=>s.type===o.t);const s=c[Math.floor(hash(song.seed,'occ',o.t)*c.length)];(s.ideas=s.ideas||[]).push(o.x);});
 return {secs,total:start,energy,barInfo};
}

  <div class="seg tall">${FMTS.map(f=>`<button class="${P.fmt===f[0]?'on':''}" data-act="fmt" data-v="${f[0]}">${f[1]}<small>${f[2]}</small></button>`).join('')}</div></section>
 ${expert?`
 <section class="blk"><h2 class="lbl">Instruments<em>${nOn} sur ${ORDER.length}</em></h2>
  <div class="togs">${ORDER.map(e=>`<button class="tog ${P.el[e]?'on':''}" style="--c:${EL[e].c}" data-act="el" data-v="${e}" aria-pressed="${!!P.el[e]}"><i></i>${EL[e].sn||EL[e].name}</button>`).join('')}</div></section>
 <section class="blk"><h2 class="lbl">Loop de départ<em>si tu pars d’un loop existant</em></h2>
  <div class="togs">${[['none','Aucun'],['main',LL.main],['verse',LL.verse],['break',LL.break]].map(o=>`<button class="chip ${P.loop.type===o[0]?'on':''}" data-act="loop" data-v="${o[0]}">${o[1]}</button>`).join('')}</div>
  ${P.loop.type!=='none'?`<div class="seg" style="margin-top:12px">${[8,16].map(n=>`<button class="${P.loop.len===n?'on':''}" data-act="looplen" data-v="${n}">${n} mesures</button>`).join('')}</div>`:''}</section>`
 :`<section class="blk"><button class="sumrow" data-act="ui" data-v="expert"><span><b>Réglages experts</b><small>${nOn} instruments · ${esc(flavName)} · ${esc(loopTxt)}</small></span>${ic('right',18,2.4)}</button></section>`}
 <div class="cta"><button class="primary" data-act="generate">Générer</button></div>`;
 const sc2=$('.scroller');if(sc2)sc2.scrollLeft=scLeft;
 const inp=$('#bpm');
 inp.addEventListener('change',e=>{P.bpm=Math.max(60,Math.min(200,Math.round(+e.target.value||P.bpm)));e.target.value=P.bpm;persist();});
 inp.addEventListener('focus',()=>setTimeout(()=>inp.select(),0));
}

/* ---------- Sauvegardes ---------- */
function renderSaved(){
 const L=store.get('arc.saved',[]);
 $('#hd').innerHTML=htitle('Sauvegardes',L.length?L.length+' structure'+(L.length>1?'s':''):'');setHH();
 $('#view').innerHTML=L.length?`<div class="list">${L.map(x=>`<div class="item"><button class="iopen" data-act="open" data-v="${x.id}"><b><span>${esc(x.name)}</span>${S.song&&S.song.savedId===x.id?'<em>ouvert</em>':''}</b><small>${esc(FAM[migrate(x.song).style]?titleOf(x.song):'')} · ${x.song.bpm} BPM · ${new Date(x.date).toLocaleDateString('fr-FR')}</small></button><button class="idel" data-act="del" data-v="${x.id}" aria-label="Supprimer">${ic('trash',20)}</button></div>`).join('')}</div>`
  :`<div class="empty">${ic('saved',44,1.5)}<p>Rien de sauvegardé pour l’instant.</p><p>Génère une structure, puis touche le signet.</p><button class="ghostbtn" data-act="setup">${ic('new',18)}Créer un morceau</button></div>`;
}

function diffTags(prev,p,el){
 const out=[];
 ORDER.forEach(e=>{if(!el[e])return;const a=prev?(prev.lv[e]||0):0,b=p.lv[e]||0;if(a===b)return;
  const sym=!a?'+':!b?'−':b>a?'↑':'↓',cls=!b||b<a?'neg':'pos';
  out.push(`<span class="ch"><i style="background:${EL[e].c}"></i><b class="${cls}">${sym}</b>${EL[e].name}${b?` <em>${EL[e].lv[b]}</em>`:''}</span>`);});
 return out.join('')||'<span class="ch"><em>pas de changement</em></span>';
}
const lenCtl=sel=>`<div class="len"><button data-act="len" data-v="-1" aria-label="Raccourcir">${ic('minus',20)}</button><b>${barsTxt(sel.bars)}</b><button data-act="len" data-v="1" aria-label="Rallonger">${ic('plus',20)}</button></div>`;
const ideaBox=x=>`<div class="idea">${ic('idea',18)}<span>${esc(x)}</span></div>`;

/* ---------- Morceau ---------- */
function renderArrange(){
 const song=S.song,ver=curVer(),T=S.T=timeline(song,ver),tpl=tplOf(song);
 if(S.sel.sec>=T.secs.length)S.sel.sec=0;
 S.sel.bar=Math.min(S.sel.bar,T.total-1);
 const sel=T.secs[S.sel.sec];
 if(S.sel.bar<sel.start||S.sel.bar>=sel.start+sel.bars)S.sel.bar=sel.start;
 const N=T.total,bpm=song.bpm,isSaved=!!(song.savedId&&!song.dirty),fl=FMTS.find(f=>f[0]===song.fmt)||FMTS[1];
 $('#hd').innerHTML=htitle(tpl.n,`${titleOf(song)} · ${bpm} BPM`)+
  `<button class="icb" data-act="regen" aria-label="Tirer une autre structure">${ic('regen',20)}</button>`+
  `<button class="icb ${isSaved?'on':''}" data-act="save" aria-label="${isSaved?'Sauvegardé':'Sauver'}">${ic('saved',20,2,isSaved)}</button>`+
  `<div class="vbar"><button class="verchip" data-act="vermenu" aria-label="Changer de version"><b>${fl[1]}</b><span>${fmtT(N*240/bpm)}</span>${ic('down',14,2.6)}</button><span class="grow"></span>${modeSeg()}</div>`;
 setHH();
 if(S.ui==='expert')renderExpert(T,sel);else renderSimple(T,sel);
}

/* Simple : aperçu collant du morceau + une carte par section, qui se déplie */
function renderSimple(T,sel){
 const song=S.song,N=T.total,bpm=song.bpm,els=ORDER.filter(e=>song.el[e]),open=S.open;
 const st=T.secs.map(s=>{const max={};s.phrases.forEach(p=>{for(const e in p.lv)if(p.lv[e])max[e]=Math.max(max[e]||0,p.lv[e]);});let en=0;for(let b=s.start;b<s.start+s.bars;b++)en+=T.energy[b];return {max,en:en/s.bars};});
 const enMax=Math.max(...st.map(x=>x.en))||1;
 const H=36,ep=energyPaths(T,H,3);
 const ov=`<div class="ov"><svg class="ovsvg" viewBox="0 0 ${N} ${H}" preserveAspectRatio="none" aria-hidden="true">${EGRAD}<path d="${ep.area}" fill="url(#eg)"/><path d="${ep.line}" fill="none" stroke="#ffb84d" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
  <div class="ovbar">${T.secs.map(s=>{const c=SEC[s.type].c,on=open&&s.i===sel.i;return `<button class="ovs${on?' on':''}" style="flex:${s.bars};background:${on||!open?c:rgba(c,.28)}" data-act="pick" data-v="${s.i}" aria-label="${esc(s.name)}"></button>`;}).join('')}</div>
  <div class="ovt"><span>0:00</span><span>${N} mesures</span><span>${fmtT(N*240/bpm)}</span></div></div>`;
 const list=T.secs.map((s,i)=>{
  const x=st[i],c=SEC[s.type].c,isOpen=open&&i===sel.i,lvl=Math.max(1,Math.round(x.en/enMax*5));
  const dots=els.map(e=>{const l=x.max[e]||0;return `<i${l?` style="background:${rgba(EL[e].c,DOT_OP[l])}"`:''}></i>`;}).join('');
  let h=`<div class="sc${isOpen?' open':''}" id="sc${i}"><button class="sch" data-act="pick" data-v="${i}" aria-expanded="${isOpen}">
   <span class="scc" style="background:${c}"></span>
   <span class="scm"><span class="sct"><span>${esc(s.name)}</span>${s.loop?'<em>ton loop</em>':''}${s.ideas&&!isOpen?'<i class="idot"></i>':''}</span>
    <span class="scs">Mesure ${s.start+1} · ${barsTxt(s.bars)}</span>
    <span class="dots">${dots}</span></span>
   <span class="meter" aria-label="Énergie ${lvl} sur 5">${[6,9,12,15,18].map((hh,k)=>`<i style="height:${hh}px"${k<lvl?' class="on"':''}></i>`).join('')}</span></button>`;
  if(isOpen){
   const pm=i>0?st[i-1].max:{},ins=els.filter(e=>x.max[e]&&!pm[e]),outs=els.filter(e=>!x.max[e]&&pm[e]);
   const chip=(e,sg)=>`<span class="ch"><i style="background:${EL[e].c}"></i><b class="${sg==='+'?'pos':'neg'}">${sg}</b>${EL[e].name}</span>`;
   const t0=s.start*240/bpm,t1=(s.start+s.bars)*240/bpm;
   h+=`<div class="scd">
    <h3 class="sdl">${i===0?'Démarre avec':'Ce qui change'}</h3>
    ${ins.length||outs.length?`<div class="chg">${ins.map(e=>chip(e,'+')).join('')}${outs.map(e=>chip(e,'−')).join('')}</div>`:'<p class="muted">Mêmes instruments, l’énergie évolue</p>'}
    ${(s.ideas||[]).map(ideaBox).join('')}
    <h3 class="sdl">Déroulé</h3>
    ${s.phrases.map(p=>`<div class="sph"><span>${p.bars===1?p.start+1:(p.start+1)+'–'+(p.start+p.bars)}</span><p>${esc(p.note)}${p.up?' <b class="up">↗</b>':''}</p></div>`).join('')}
    <div class="sfoot"><span>${fmtT(t0)} – ${fmtT(t1)}</span>${lenCtl(s)}</div></div>`;
  }
  return h+'</div>';
 }).join('');
 $('#view').innerHTML=ov+`<div class="scl">${list}</div>`;
 if(S._scrollSec){S._scrollSec=false;const el=$('#sc'+sel.i),ovh=$('.ov').offsetHeight,hh=$('#hd').offsetHeight;
  const top=el.getBoundingClientRect().top+window.scrollY-hh-ovh-6;window.scrollTo({top:Math.max(0,top),behavior:'smooth'});}
}

/* Expert : grille piste par piste + tiroir de détail mesure par mesure */
function renderExpert(T,sel){
 const old=$('#grid'),oldLeft=old?old.scrollLeft:0,om=$('#more'),omTop=om?om.scrollTop:0;
 const song=S.song,N=T.total,bpm=song.bpm;
 const X=(n,px)=>`calc(var(--bw) * ${n}${px?(px>0?' + ':' - ')+Math.abs(px)+'px':''})`;
 const row=(hd,lane,cls,attr)=>`<div class="row ${cls}"><div class="hd"${attr||''}>${hd}</div><div class="lane" style="width:${X(N)}">${lane}</div></div>`;
 // règle (repères toutes les 4 mesures ; la densité s'adapte au zoom)
 let marks='';for(let b=0;b<N;b+=4)marks+=`<span class="mk${b%8===0?' m8':''}${b%16===0?' m16':''}" style="left:${X(b)}">${b+1}</span>`;
 let g=row(`<button class="fitb" data-act="fit" aria-label="Tout afficher">${ic('fit',15,2.2)}</button>`,marks,'r-ruler');
 g+=row('<span>Sections</span>',T.secs.map(s=>{const c=SEC[s.type].c,on=s.i===S.sel.sec;
  return `<div class="sec ${on?'sel':''}" style="left:${X(s.start,1)};width:${X(s.bars,-2)};background:${on?c:rgba(c,.24)};box-shadow:inset 2px 0 0 ${c};color:${tint(c,.5)}">${s.loop?'↻ ':''}${esc(s.name)}${s.ideas?'<i class="idot"></i>':''}</div>`;}).join(''),'r-sec');
 const H=42,ep=energyPaths(T,H,4);
 g+=row(`<span>Énergie</span><small>${Math.round(T.energy[S.sel.bar]*100)} %</small>`,`<svg viewBox="0 0 ${N} ${H}" preserveAspectRatio="none" style="display:block;width:${X(N)};height:${H}px">${EGRAD}<path d="${ep.area}" fill="url(#eg)"/><path d="${ep.line}" fill="none" stroke="#ffb84d" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`,'r-energy');
 // pistes : l'opacité suit le niveau ; le nom du niveau s'affiche quand on zoome
 ORDER.filter(e=>song.el[e]).forEach(e=>{
  let regs='';const c=EL[e].c;
  T.secs.forEach(s=>{let cur=null;const push=r=>{if(r&&r.l)regs+=`<div class="reg" style="left:${X(r.st,1)};width:${X(r.n,-2)};background:${rgba(c,LV_OP[r.l])};--tc:${r.l===3?'rgba(0,0,0,.72)':tint(c,.6)}">${EL[e].lv[r.l]}</div>`;};
   s.phrases.forEach(p=>{const l=p.lv[e]||0;if(cur&&cur.l===l)cur.n+=p.bars;else{push(cur);cur={st:p.start,n:p.bars,l};}});push(cur);});
  g+=row(`<i style="background:${c}"></i><span>${EL[e].name}</span>`,regs,'r-trk',` data-act="hint" data-v="${e}"`);
 });
 g+=`<div class="selcol" style="left:calc(${HDW}px + var(--bw) * ${sel.start});width:${X(sel.bars)}"></div><div class="playhead" style="left:calc(${HDW}px + var(--bw) * ${S.sel.bar+.5})"></div>`;
 // tiroir de la section sélectionnée
 const t0=sel.start*240/bpm,t1=(sel.start+sel.bars)*240/bpm;
 let more=`<div class="lenrow"><span>Longueur</span>${lenCtl(sel)}</div>`;
 (sel.ideas||[]).forEach(x=>more+=ideaBox(x));
 more+=`<h3 class="lbl">Déroulé</h3>`;
 sel.phrases.forEach((p,pi)=>{
  const prev=pi>0?sel.phrases[pi-1]:(sel.i>0?T.secs[sel.i-1].phrases[T.secs[sel.i-1].phrases.length-1]:null);
  const on=S.sel.bar>=p.start&&S.sel.bar<p.start+p.bars;
  more+=`<div class="ph ${on?'on':''}" data-act="bar" data-v="${p.start}"><div class="pr">${p.bars===1?p.start+1:(p.start+1)+'–'+(p.start+p.bars)}</div><div><div class="pn">${esc(p.note)}${p.up?' <span class="up">↗</span>':''}</div><div class="chg">${diffTags(prev,p,song.el)}</div></div></div>`;
 });
 const sheet=`<div class="sheet ${S.sheet?'open':''}" id="sheet">
 <div class="grab" data-act="sheet"><span></span></div>
 <div class="shead"><button class="nav" data-act="step" data-v="-1" ${sel.i>0?'':'disabled'} aria-label="Section précédente">${ic('left',22,2.2)}</button>
  <button class="sinfo" data-act="sheet" aria-label="Afficher ou masquer le détail"><span class="sname"><i style="background:${SEC[sel.type].c}"></i><span>${esc(sel.name)}</span>${sel.loop?'<em>ton loop</em>':''}</span><span class="smeta">Mesures ${sel.start+1}–${sel.start+sel.bars} · ${fmtT(t0)}–${fmtT(t1)}${ic('up',14,2.4)}</span></button>
  <button class="nav" data-act="step" data-v="1" ${sel.i<T.secs.length-1?'':'disabled'} aria-label="Section suivante">${ic('right',22,2.2)}</button></div>
 <div class="more" id="more">${more}</div></div>`;
 $('#view').innerHTML=`<div class="grid" id="grid"><div class="gin" style="width:calc(var(--bw) * ${N} + ${HDW}px)">${g}</div></div>${sheet}`;
 const grid=$('#grid');
 applyBw(grid);sizeRows();attachPinch(grid);attachSheet($('#sheet'));
 grid.scrollLeft=oldLeft;
 if(S.sel.sec===S.lastSec)$('#more').scrollTop=omTop;
 S.lastSec=S.sel.sec;
 if(S._fit){S._fit=false;ACT.fit();}
 if(S._scrollTo){const x=S.sel.bar*S.bw,vw=grid.clientWidth-HDW;if(x<grid.scrollLeft||x>grid.scrollLeft+vw-20)grid.scrollLeft=Math.max(0,x-vw/3);S._scrollTo=false;}
}

function selectBar(bar,scroll){const T=S.T;bar=Math.max(0,Math.min(T.total-1,bar));S.sel.bar=bar;S.sel.sec=T.barInfo[bar].s;S._scrollTo=!!scroll;render();}

function newSong(seedOnly){
 const P=S.params;
 if(!seedOnly){S.song={style:P.style,flavor:P.flavor||null,bpm:P.bpm,el:clone(P.el),loop:clone(P.loop),fmt:P.fmt,versions:{}};}
 const prev=seedOnly&&S.song.seed?tplOf(S.song).n:null,pool=poolOf(S.song);
 for(let t=0;t<20;t++){S.song.seed=Math.random().toString(36).slice(2,10);if(!prev||pool.length<2||tplOf(S.song).n!==prev)break;}
 S.song.versions={};delete S.song.savedId;delete S.song.dirty;
 S.sel={sec:0,bar:0};S.open=false;curVer();persist();
}
function go(view){S.view=view;render();window.scrollTo(0,0);}

const ACT={
 ui(v){if(S.ui===v)return;S.ui=v;store.set('arc.ui',v);if(S.view==='arrange')S._fit=true;render();window.scrollTo(0,0);},
 style(v){S.params.style=v;S.params.flavor='';S.params.bpm=FAM[v].bpm;persist();render();},
 flavor(v){S.params.flavor=v;S.params.bpm=v?FLAV[v].bpm:FAM[S.params.style].bpm;persist();render();},
 bpm(v){const P=S.params;P.bpm=Math.max(60,Math.min(200,P.bpm+ +v));$('#bpm').value=P.bpm;persist();},
 fmt(v){S.params.fmt=v;persist();render();},
 el(v){S.params.el[v]=!S.params.el[v];persist();render();},
 loop(v){S.params.loop.type=v;persist();render();},
 looplen(v){S.params.loop.len=+v;persist();render();},
 generate(){const inp=$('#bpm');if(inp){S.params.bpm=Math.max(60,Math.min(200,Math.round(+inp.value||S.params.bpm)));}
  if(!ORDER.some(e=>S.params.el[e])){toast('Choisis au moins un instrument');return;}
  newSong(false);S.sheet=false;S._fit=true;go('arrange');},
 regen(){newSong(true);S._fit=true;render();},
 ver(v){if(S.song.fmt===v)return;S.song.fmt=v;touched();S.sel={sec:0,bar:0};S.open=false;S._fit=true;persist();render();},
 vermenu(){
  const song=S.song;
  menu('Version',FMTS.map(f=>{const v=song.versions[f[0]]||(song.versions[f[0]]=buildVersion(song,f[0])),bars=v.sections.reduce((a,s)=>a+s.bars,0);
   return {on:f[0]===song.fmt,fn:()=>ACT.ver(f[0]),html:`<span><b>${f[1]}</b><small>${barsTxt(bars)} · cible ${f[2]}</small></span><em>${fmtT(bars*240/song.bpm)}</em>`};}));
 },
 pick(v){const i=+v;if(S.sel.sec===i&&S.open){S.open=false;render();return;}S.sel.sec=i;S.sel.bar=S.T.secs[i].start;S.open=true;S._scrollSec=true;render();},
 fit(){const grid=$('#grid');if(!grid||!S.T)return;setBw((grid.clientWidth-HDW-6)/S.T.total,0,HDW);store.set('arc.bw',S.bw);},
 hint(e){const h=hintOf(S.song,e);if(h)toast(EL[e].name+' : '+h);},
 len(v){const s=curVer().sections[S.sel.sec],step=s.loop?S.song.loop.len:4,nb=s.bars+(+v)*step;if(nb<step||nb>128)return;s.bars=nb;touched();persist();render();},
 bar(v){selectBar(+v,true);},
 step(v){const T=S.T,n=S.sel.sec+ +v;if(!T||n<0||n>=T.secs.length)return;selectBar(T.secs[n].start,true);},
 sheet(){S.sheet=!S.sheet;const sh=$('#sheet');if(sh)sh.classList.toggle('open',S.sheet);},
 setup(){go('setup');},
 saved(){go('saved');},
 back(){if(S.song)go('arrange');},
 save(){
  const L=store.get('arc.saved',[]),song=S.song,ent=song.savedId&&L.find(x=>x.id===song.savedId);
  if(ent){if(!song.dirty){toast('Déjà sauvegardé');return;}delete song.dirty;ent.song=clone(song);ent.date=Date.now();store.set('arc.saved',L);persist();render();toast('Sauvegarde mise à jour');return;}
  ask('Nommer cette structure',`${tplOf(song).n} · ${song.bpm} BPM`,'Sauver',name=>{
   const L=store.get('arc.saved',[]);song.savedId=Date.now().toString(36);delete song.dirty;
   L.unshift({id:song.savedId,name:name.trim()||'Sans titre',date:Date.now(),song:clone(song)});
   store.set('arc.saved',L);persist();render();toast('Sauvegardé');});
 },
 open(v){const x=store.get('arc.saved',[]).find(x=>x.id===v);if(!x)return;S.song=migrate(clone(x.song));S.song.savedId=x.id;delete S.song.dirty;S.sel={sec:0,bar:0};S.open=false;S.sheet=false;S._fit=true;persist();go('arrange');},
 // suppression immédiate, avec « Annuler » dans le toast plutôt qu'une confirmation
 del(v){
  const L=store.get('arc.saved',[]),i=L.findIndex(x=>x.id===v);if(i<0)return;
  const x=L.splice(i,1)[0],wasOpen=!!(S.song&&S.song.savedId===v);
  store.set('arc.saved',L);if(wasOpen)delete S.song.savedId;persist();render();
  toast('« '+x.name+' » supprimé',{label:'Annuler',fn(){const L=store.get('arc.saved',[]);L.splice(Math.min(i,L.length),0,x);store.set('arc.saved',L);if(wasOpen&&S.song)S.song.savedId=v;persist();render();}});
 }
};

/* Maintien sur − / + : un appui = un pas, appui long = défilement */
let hold=null;
document.addEventListener('pointerdown',e=>{
 const b=e.target.closest('[data-hold]');if(!b)return;
 const run=()=>ACT[b.dataset.act](b.dataset.v),h=hold={b,rep:false};
 h.t=setTimeout(()=>{h.rep=true;run();h.iv=setInterval(run,70);},400);
});
const endHold=e=>{if(!hold)return;const h=hold;hold=null;clearTimeout(h.t);clearInterval(h.iv);if(e.type==='pointerup'&&!h.rep&&h.b.contains(e.target))ACT[h.b.dataset.act](h.b.dataset.v);};
document.addEventListener('pointerup',endHold);document.addEventListener('pointercancel',endHold);

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');
 if(b){if(b.hasAttribute('data-hold')&&e.detail!==0)return;const f=ACT[b.dataset.act];if(f)f(b.dataset.v,b,e);return;}
 if(Date.now()-S.pinchAt<400)return;
 const lane=e.target.closest('#grid .lane');
 if(lane&&S.T){const r=lane.getBoundingClientRect();selectBar(Math.floor((e.clientX-r.left)/S.bw),false);}
});
render();
</script>
</body>
