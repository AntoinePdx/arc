<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Arc</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231c1c1e'/%3E%3Cpath d='M4 18C7.5 6 16.5 6 20 18' fill='none' stroke='%23f5c542' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#1c1c1e;--panel:#262628;--panel2:#2f2f32;--line:#3a3a3d;--txt:#e8e8ea;--dim:#9a9aa0;--acc:#f5c542;--hdw:92px;--tab:56px;--sb:env(safe-area-inset-bottom);--sl:env(safe-area-inset-left);--sr:env(safe-area-inset-right);--st:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:disabled{cursor:default}
button:active:not(:disabled){filter:brightness(1.25)}
svg{flex:none}
/* en-tête */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;min-height:56px;padding:calc(var(--st) + 6px) calc(var(--sr) + 12px) 6px calc(var(--sl) + 14px);background:rgba(28,28,30,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.htitle{flex:1;min-width:0}
.htitle b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle small{display:block;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hact{flex:none;height:40px;padding:0 15px 0 12px;border-radius:20px;border:0;background:var(--acc);color:#1c1c1e;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
/* barre d'onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;padding:0 var(--sr) var(--sb) var(--sl);background:rgba(22,22,24,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.tab{flex:1;height:var(--tab);background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--dim)}
.tab.on{color:var(--acc)}
.tab:disabled{opacity:.3}
main{max-width:760px;margin:0 auto;padding:14px var(--sr) calc(var(--tab) + var(--sb) + 28px) var(--sl)}
.v-setup main{padding-bottom:calc(var(--tab) + var(--sb) + 96px)}
.v-arrange main{max-width:none;padding-bottom:calc(var(--tab) + var(--sb) + 160px)}
/* cartes et contrôles */
.wrap{padding:0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 16px 12px}
.card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);font-weight:600}
.card h3.h3b{margin-top:16px}
.opt{text-transform:none;letter-spacing:0;font-weight:400;color:#77777d}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:0 16px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#1c1c1e;font-weight:600}
.grp{margin-bottom:12px}
.grp small{display:block;color:var(--dim);font-size:12px;margin-bottom:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;align-items:center;gap:9px;min-height:46px;padding:0 10px 0 0;background:var(--panel2);border:1px solid var(--line);border-radius:11px;text-align:left;font-size:14px;overflow:hidden}
.tile i{width:4px;align-self:stretch;flex:none}
.tile span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile em{width:22px;height:22px;border-radius:50%;border:1.5px solid #55555b;display:grid;place-items:center;flex:none;color:transparent}
.tile.on{background:#36363b;border-color:#505056;font-weight:500}
.tile.on em{background:var(--acc);border-color:var(--acc);color:#1c1c1e}
.tile:not(.on){color:var(--dim)}
.tile:not(.on) i{opacity:.35}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;min-height:36px;background:none;border:0;border-radius:8px;padding:4px;font-size:14px;color:var(--dim)}
.seg button.on{background:#4a4a50;color:var(--txt);font-weight:600}
.seg button small{display:block;font-size:11px;opacity:.75;font-weight:400}
.seg.big button{min-height:44px}
.hint{color:var(--dim);font-size:13px;margin:10px 0 0}
.bpm{display:flex;align-items:center;justify-content:center;gap:14px}
.bpm button{width:56px;height:56px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center}
.bpmv{display:flex;flex-direction:column;align-items:center}
.bpmv input{width:110px;height:56px;text-align:center;background:#161618;border:1px solid var(--line);border-radius:14px;color:var(--txt);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;-moz-appearance:textfield;font-family:inherit}
.bpmv input::-webkit-inner-spin-button{-webkit-appearance:none}
.bpmv span{color:var(--dim);font-size:11px;margin-top:4px;letter-spacing:.8px}
.cta{position:fixed;left:0;right:0;bottom:calc(var(--tab) + var(--sb));z-index:25;max-width:760px;margin:0 auto;padding:16px calc(16px + var(--sr)) 10px calc(16px + var(--sl));background:linear-gradient(to bottom,rgba(28,28,30,0),var(--bg) 40%)}
.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:0 16px;border:0;border-radius:14px;background:var(--acc);color:#1c1c1e;font-weight:700;font-size:17px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.pill{flex:none;height:40px;padding:0 14px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
/* morceau */
.top{padding:0 16px}
.strow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.stxt{flex:1;min-width:0}
.stxt small{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
.stxt b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtools{display:flex;align-items:center;gap:8px;padding:10px 16px 0}
.gtools .seg{flex:0 1 190px}
.gtools .sp{flex:1}
.ib{height:40px;min-width:44px;padding:0 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center}
.zoomgrp{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;flex:none}
.zoomgrp .ib{border:0;border-radius:0}
.zoomgrp .ib+.ib{border-left:1px solid var(--line)}
.grid{overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#19191b;margin-top:12px}
.gin{position:relative}
.row{display:flex}
.hd{position:sticky;left:0;z-index:4;width:var(--hdw);flex:0 0 var(--hdw);background:#232325;border-right:1px solid var(--line);border-bottom:1px solid #2b2b2e;padding:0 7px;display:flex;flex-direction:column;justify-content:center;font-size:11px;overflow:hidden}
.hd b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.hd b i{width:5px;height:14px;border-radius:2px;flex:none}
.hd small{color:var(--dim);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:10px}
.lane{position:relative;flex:none;border-bottom:1px solid #2b2b2e;background-image:repeating-linear-gradient(to right,#2d2d30 0 1px,transparent 1px calc(var(--bw) * 4))}
.z-lo .lane{background-image:repeating-linear-gradient(to right,#2d2d30 0 1px,transparent 1px calc(var(--bw) * 16))}
.r-ruler .lane,.r-ruler .hd{height:20px}
.r-ruler .lane{background:#202022}
.mk{position:absolute;top:3px;font-size:9px;color:var(--dim);padding-left:2px;border-left:1px solid #4a4a4e;height:14px;line-height:14px;font-variant-numeric:tabular-nums}
.z-mid .mk:not(.m8),.z-lo .mk:not(.m16){display:none}
.r-sec .lane,.r-sec .hd{height:30px}
.sec{position:absolute;top:3px;bottom:3px;border-radius:5px;overflow:hidden;font-size:11px;font-weight:600;color:#fff;padding:0 5px;line-height:24px;white-space:nowrap;text-overflow:clip;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);text-shadow:0 1px 1px rgba(0,0,0,.3)}
.sec.sel{box-shadow:inset 0 0 0 2px #fff}
.r-energy .lane,.r-energy .hd{height:60px}
.r-energy .hd small{padding-left:0;font-size:10px;color:var(--acc)}
.r-trk .lane,.r-trk .hd{height:28px}
.reg{position:absolute;top:3px;bottom:3px;border-radius:3px;font-size:9px;color:rgba(0,0,0,.78);padding:0 4px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;border-top:1px solid rgba(255,255,255,.25)}
.nolbl .reg{color:transparent}
.selcol{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.06);pointer-events:none;z-index:1}
.playhead{position:absolute;top:0;bottom:0;width:1px;background:#fff;pointer-events:none;z-index:3;box-shadow:0 0 4px rgba(255,255,255,.6)}
/* panneau de section (tiroir du bas) */
.sheet{position:fixed;left:0;right:0;bottom:calc(var(--tab) + var(--sb));z-index:25;max-width:760px;margin:0 auto;background:#29292c;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.4);padding:0 calc(14px + var(--sr)) 10px calc(14px + var(--sl))}
.grab{display:block;width:100%;height:22px;background:none;border:0;padding:0;touch-action:none}
.grab span{display:block;width:40px;height:5px;border-radius:3px;background:#55555b;margin:8px auto 0}
.shead{display:flex;align-items:center;gap:8px;touch-action:none}
.nav{width:46px;height:46px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.nav:disabled{opacity:.25}
.sinfo{flex:1;min-width:0;text-align:center}
.dh{display:flex;align-items:center;justify-content:center;gap:7px;font-size:17px;min-width:0}
.dh b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.badge{font-size:11px;background:#3a3a3e;padding:2px 8px;border-radius:999px;color:var(--txt);font-weight:500;white-space:nowrap}
.meta{color:var(--dim);font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;touch-action:none}
.len{display:flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:2px}
.len button{width:44px;height:38px;border-radius:10px;background:none;border:0;display:grid;place-items:center}
.len span{min-width:92px;text-align:center;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.morebtn{height:42px;padding:0 6px 0 12px;border-radius:10px;background:none;border:0;color:var(--acc);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.morebtn svg{transition:transform .25s}
.open .morebtn svg{transform:rotate(180deg)}
.more{max-height:0;overflow:hidden;transition:max-height .28s ease;margin:0 -14px;padding:0 14px}
.open .more{max-height:calc(68vh - 150px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ph{border-top:1px solid var(--line);padding:11px 12px;margin:0 -14px;border-left:3px solid transparent}
.ph.on{border-left-color:var(--acc);background:rgba(245,197,66,.06)}
.pr{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.pn{margin:2px 0 7px}
.up{color:var(--acc)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;padding:3px 8px;border-radius:6px;background:#333337;display:inline-flex;gap:5px;align-items:center}
.tag i{width:7px;height:7px;border-radius:50%}
.sub{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin:14px 0 7px}
.idea{margin:12px 0 2px;padding:10px 12px;border-radius:10px;background:rgba(245,197,66,.1);border:1px solid rgba(245,197,66,.3);font-size:14px}
/* sauvegardes */
.item{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.iopen{flex:1;min-width:0;text-align:left;background:none;border:0;padding:13px 14px}
.iopen b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iopen small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.iopen .badge{margin-left:6px;font-size:10px;vertical-align:2px;background:rgba(245,197,66,.18);color:var(--acc)}
.idel{background:none;border:0;border-left:1px solid var(--line);width:56px;color:var(--dim);display:grid;place-items:center}
.empty{color:var(--dim);text-align:center;padding:48px 16px;display:flex;flex-direction:column;align-items:center;gap:4px}
.empty p{margin:4px 0}
.empty .pill{margin-top:16px;color:var(--txt)}
/* toasts et boîte de dialogue */
.toast{position:fixed;left:50%;top:calc(var(--st) + 66px);transform:translateX(-50%);display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);background:#3a3a3e;color:var(--txt);padding:10px 18px;border-radius:999px;font-size:14px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.45);transition:opacity .3s;white-space:nowrap}
.toast button{background:none;border:0;color:var(--acc);font-weight:700;padding:4px 0}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-start;padding:calc(var(--st) + 90px) 16px 16px}
.dlg{width:100%;max-width:420px;background:#2a2a2d;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.dlg h4{margin:0 0 12px;font-size:17px}
.dlg input{width:100%;height:48px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:#161618;color:var(--txt);font:inherit;font-size:17px}
.dlgb{display:flex;gap:10px;margin-top:14px}
.dlgb button{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:16px}
.dlgb .ok{background:var(--acc);border-color:var(--acc);color:#1c1c1e}
/* téléphone à l'horizontale : on rend la place à la grille */
@media (orientation:landscape) and (max-height:500px){
 :root{--tab:44px}
 .tab{flex-direction:row;gap:6px;font-size:12px}
 header{min-height:46px;padding-top:calc(var(--st) + 4px);padding-bottom:4px}
 .sheet:not(.open) .srow{display:none}
 .v-arrange main{padding-bottom:calc(var(--tab) + var(--sb) + 90px)}
 .open .more{max-height:calc(100vh - 230px)}
 .grab{height:16px}
 .grab span{margin-top:6px}
 .nav{width:40px;height:40px}
 .top{display:flex;align-items:center;gap:12px}
 .strow{flex:1;min-width:0;margin:0}
 .top .seg{flex:1.4}
 .top .seg button{min-height:36px}
 .top .seg button small{display:none}
 .grid{margin-top:8px}
 .sheet{max-width:none}
}
</style>
</head>

<script>
/* ============ DONNÉES ============ */
const EL={
 k:{name:'Kick',w:3,c:'#E9C46A',lv:['','doux','régulier','plein']},
 s:{name:'Snare / Clap',w:1.5,c:'#F4A261',lv:['','léger','backbeat','plein + fills']},
 d:{name:'Batterie',sn:'Reste batterie',w:1.5,c:'#D9B64E',lv:['','hats seuls','hats + ride','batterie full']},
 p:{name:'Percus',w:1,c:'#CF9A57',lv:['','légères','groove','chargées']},
 b:{name:'Basse',w:2.5,c:'#9B7BE0',lv:['','notes tenues','groove','à fond']},
 r:{name:'Rythmique',w:1.5,c:'#4FB286',lv:['','épars','groove','plein']},
 a:{name:'Nappe',w:1,c:'#3BA8A0',lv:['','discrète','présente','ample']},
 l:{name:'Lead',w:1.5,c:'#4A90E2',lv:['','esquisse','mélodie','hook complet']},
 i:{name:'Intensité',w:2,c:'#E05D5D',lv:['','subtile','montée','sommet']},
 v:{name:'Chant',w:1.5,c:'#D96BB0',lv:['','ad-libs','couplet','lead + doublures']},
 c:{name:'Chœurs',w:1.2,c:'#B07ACC',lv:['','oohs','chœurs','chœur complet']},
 f:{name:'FX',w:.5,c:'#8A939B',lv:['','texture','riser','sweep / impact']}
};
const ORDER='ksdpbrailvcf'.split('');
const GROUPS=[['Batterie','ksdp'],['Musique','brali'],['Voix','vc'],['Extras','f']];
const DEF_HINT={k:'Kick',s:'Snare ou clap',d:'Hats, ride, cymbales',p:'Congas, shakers',f:'Risers, sweeps'};
const SEC={intro:{n:'Intro',c:'#6E7B8F'},groove:{n:'Groove',c:'#3A8FB7'},verse:{n:'Couplet',c:'#3B6FD0'},pre:{n:'Pré-refrain',c:'#2AA198'},chorus:{n:'Refrain',c:'#46A84A'},drop:{n:'Drop',c:'#E0533D'},build:{n:'Montée',c:'#E8913A'},break:{n:'Break',c:'#8E6CC6'},bridge:{n:'Pont',c:'#A55EC0'},solo:{n:'Solo',c:'#1C9C9C'},vamp:{n:'Vamp',c:'#3A8FB7'},outro:{n:'Outro',c:'#6E7B8F'}};
const FMTS=[['radio','Radio','~3 min'],['standard','Standard','~4–5 min'],['extended','Extended','~6–7 min']];

/* Couleurs facultatives : ajustent BPM, instruments suggérés et idées, pas la structure */
const FLAV={
 french:{n:'French Touch',fam:'house',bpm:122,h:{r:'Sample disco filtré',a:'Cordes / nappe',l:'Vocoder / hook synthé',i:'Phaser, couche filtrée',b:'Basse funky',v:'Voix vocodée',c:'Chops vocaux',k:'Punchy, source du sidechain'},ideas:[
  ['drop','Ouvre le passe-bas lentement sur tout le premier drop au lieu de tout ouvrir d’un coup.'],
  ['break','Le loop seul avec beaucoup de phaser, puis une mesure de silence total avant le drop.'],
  ['drop','8 dernières mesures : pousse plus fort le pompage du sidechain sur le sample.'],
  ['groove','Redécoupe le sample en tranches d’un temps et réarrange-les pour la seconde moitié.'],
  ['outro','Termine sur le sample brut, non filtré, sans batterie, comme une fin de vinyle.'],
  ['build','Faux drop : le kick revient une mesure, on recoupe, puis le vrai drop.']]},
 garage:{n:'Garage House',fam:'house',bpm:123,h:{r:'Accords orgue / piano',a:'Nappe',l:'Riff synthé',i:'Montées d’orgue',b:'Basse profonde',v:'Lead soulful',c:'Chœurs'},ideas:[
  ['break','Break dub : batterie coupée, phrases vocales qui résonnent dans un long delay.'],
  ['verse','Couplet 2 : une basse à l’orgue remplace la basse synthé.'],
  ['chorus','Dernier refrain : ad-libs du lead par-dessus les chœurs, sans nouvelles paroles.'],
  ['intro','Ouvre avec le hook vocal a cappella sur le kick.'],
  ['groove','Groove instrumental avec des stabs d’orgue qui répondent au chant.']]},
 deep:{n:'Deep House',fam:'house',bpm:120,h:{r:'Stabs orgue / Rhodes',a:'Nappe chaude',l:'Chop vocal / lead feutré',i:'Delays dub sur l’accord',b:'Sub rond',v:'Voix soulful',c:'Nappes vocales'},ideas:[
  ['intro','32 mesures de kick, hats et percus seuls avant le premier accord.'],
  ['break','Delay dub sur un seul stab d’accord, feedback qui monte, puis coupure.'],
  ['drop','Retire le kick 8 mesures en plein milieu, basse et accords continuent.'],
  ['groove','Une seule phrase parlée ou chantée, noyée de reverb, utilisée une fois.'],
  ['outro','Garde seulement la nappe et les queues de delay sur les 8 dernières mesures.']]},
 gospel:{n:'House Gospel',fam:'house',bpm:124,h:{r:'Piano gospel',a:'Orgue Hammond',l:'Riff piano',i:'Claps, montées d’orgue',b:'Basse',v:'Chant lead',c:'Chorale'},ideas:[

/* ============ MOTEUR ============ */
function hash(...a){let h=2166136261>>>0;const s=a.join('|');for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}h^=h>>>15;h=Math.imul(h,2246822507)>>>0;h^=h>>>13;return (h>>>0)/4294967296;}
function lvParse(str){const o={};str.replace(/([a-z])(\d)/g,(m,e,n)=>{o[e]=+n;return m;});return o;}
function recipe(fam,type){return (R[fam]&&R[fam][type])||R.house[type]||R.disco[type]||R.soul[type];}

function alloc(spec,N){
 let it=spec.map(p=>({fx:p[0][0]==='='?+p[0].slice(1):0,w:p[0][0]==='*'?(+p[0].slice(1)||1):0,lv:p[1],note:p[2]||'',up:!!p[3]}));
 const sumF=()=>it.reduce((a,i)=>a+i.fx,0),flex=()=>it.filter(i=>!i.fx);
 while(it.length>1){const R=N-sumF(),fl=flex().length;if(R>=0&&R>=fl)break;const k=it.findIndex(i=>i.fx);it.splice(k>=0?k:0,1);}
 if(it.length===1){it[0].bars=N;}
 else{
  const F=sumF(),Rm=N-F,fl=flex();
  it.forEach(i=>{if(i.fx)i.bars=i.fx;});
  if(fl.length){
   const u=Rm>=4*fl.length?4:Rm>=2*fl.length?2:1,units=Math.floor(Rm/u),W=fl.reduce((a,i)=>a+i.w,0);
   fl.forEach(i=>i.un=Math.max(1,Math.floor(units*i.w/W)));
   let s=fl.reduce((a,i)=>a+i.un,0),j=fl.length-1;
   while(s<units){fl[j].un++;s++;j=(j-1+fl.length)%fl.length;}
   while(s>units){const m=fl.reduce((a,i)=>i.un>a.un?i:a);m.un--;s--;}
   fl.forEach(i=>i.bars=i.un*u);fl[fl.length-1].bars+=Rm-units*u;
  }else it[it.length-1].bars+=Rm;
 }
 return it.filter(i=>i.bars>0).map(i=>({bars:i.bars,lv:lvParse(i.lv),note:i.note,up:i.up}));
}

function phrasesOf(song,s){
 const vars=recipe(song.style,s.type);
 let avail=vars.map((v,i)=>i).filter(i=>{const n=vars[i].n;return !n||[...n].every(e=>song.el[e]);});
 if(!avail.length)avail=[0];
 let vi=avail[Math.floor(hash(song.seed,s.type,0)*avail.length)];
 for(let j=1;j<=s.k;j++)if(hash(song.seed,s.type,j,'c')>0.6)vi=avail[Math.floor(hash(song.seed,s.type,j)*avail.length)];
 const v=vars[vi],ph=alloc(v.p||v,s.bars);
 ph.forEach(p=>{for(const e in p.lv)if(!song.el[e]||!EL[e])delete p.lv[e];});
 return ph;
}

function loopTypeOf(fam,t,seq){
 const map={main:['drop','chorus'],verse:fam==='house'?['groove','verse']:['verse','groove'],break:['break','bridge']};
 const c=map[t];if(!c)return null;return c.find(x=>seq.some(s=>s.type===x))||null;
}
function parseSeq(str,fmt){
 return str.split(' ').filter(t=>{const c=t[0];if(c==='+')return fmt==='extended';if(c==='~')return fmt!=='radio';if(c==='!')return fmt==='radio';return true;})
  .map(t=>{const m=t.match(/([a-z]+)(\d+)/);return {type:m[1],bars:+m[2],o:+m[2]};});
}
function poolOf(song){
 let p=TPL[song.style].filter(t=>!t.v||song.el.v);if(!p.length)p=TPL[song.style];
 if(song.loop&&song.loop.type!=='none'){const q=p.filter(t=>loopTypeOf(song.style,song.loop.type,parseSeq(t.s,'extended')));if(q.length)p=q;}
 return p;
}
function tplOf(song){const p=poolOf(song);return p[Math.floor(hash(song.seed,'tpl')*p.length)];}
function ideasOf(song){return (song.flavor&&FLAV[song.flavor]?FLAV[song.flavor].ideas:[]).concat(FAM[song.style].ideas);}
function hintOf(song,e){const f=song.flavor&&FLAV[song.flavor];return (f&&f.h[e])||FAM[song.style].h[e]||DEF_HINT[e]||'';}
function titleOf(song){return FAM[song.style].n+(song.flavor&&FLAV[song.flavor]?' · '+FLAV[song.flavor].n:'');}
function migrate(x){if(x&&!FAM[x.style]&&MIG[x.style]){const m=MIG[x.style];x.style=m[0];x.flavor=m[1];if(x.versions)x.versions={};}if(x&&x.style==='vocalhouse')x.style='house';return x;}

function buildVersion(song,fmt){
 const fam=song.style;
 const seq=parseSeq(tplOf(song).s,fmt);
 const target=Math.round((fam==='soul'?TARGET_SOUL:TARGET)[fmt]*song.bpm/4);
 const step=fam==='soul'?4:8,min=fam==='soul'?4:8;
 // on rallonge surtout grooves / intro / outro ; on ne raccourcit jamais couplets, refrains ni drops (la durée reste une estimation)
 const pick=list=>{const c=[];list.forEach(t=>seq.forEach((s,i)=>{if(s.type===t)c.push(i);}));return c;};
 const grow=pick(PRI[fam]),shrink=pick(['intro','outro','break','groove','vamp','solo']);
 let total=seq.reduce((a,s)=>a+s.bars,0),gi=Math.floor(hash(song.seed,'ci')*Math.max(1,grow.length)),si=0,guard=0,fails=0;
 while(guard++<80){
  const diff=target-total;
  if(diff>0){if(diff<=step/2||!grow.length)break;const idx=grow[gi++%grow.length];seq[idx].bars+=step;total+=step;}
  else{if(total<=target*1.12||!shrink.length||fails>shrink.length)break;const idx=shrink[si++%shrink.length];
   if(seq[idx].bars-step>=Math.max(min,seq[idx].o/2)){seq[idx].bars-=step;total-=step;fails=0;}else fails++;}
 }
 const lt=song.loop&&song.loop.type!=='none'?loopTypeOf(fam,song.loop.type,seq):null;
 if(lt){const L=song.loop.len;seq.forEach(s=>{if(s.type===lt){s.loop=true;s.bars=Math.max(L,Math.round(s.bars/L)*L);}});}
 const cnt={};seq.forEach(s=>{delete s.o;s.k=cnt[s.type]=(cnt[s.type]===undefined?0:cnt[s.type]+1);});
 return {sections:seq};
}

function timeline(song,ver){
 let start=0;
 const secs=ver.sections.map((s,i)=>{const ph=phrasesOf(song,s);let b=start;ph.forEach(p=>{p.start=b;b+=p.bars;});const o=Object.assign({},s,{i,start,phrases:ph});start+=s.bars;return o;});
 const tot={},cnt={};secs.forEach(s=>tot[s.type]=(tot[s.type]||0)+1);
 secs.forEach(s=>{cnt[s.type]=(cnt[s.type]||0)+1;s.name=SEC[s.type].n+(tot[s.type]>1?' '+cnt[s.type]:'');});
 const W=ORDER.filter(e=>song.el[e]).reduce((a,e)=>a+EL[e].w,0)||1;
 const energy=[],barInfo=[];
 secs.forEach(s=>s.phrases.forEach((p,pi)=>{
  let e=0;for(const k in p.lv)e+=EL[k].w*p.lv[k]/3;e/=W;
  for(let j=0;j<p.bars;j++){let v=e;if(p.up)v=e*(0.55+0.45*(p.bars>1?j/(p.bars-1):1));energy.push(Math.min(1,v));barInfo.push({s:s.i,p:pi});}
 }));
 const n={radio:1,standard:2,extended:3}[song.fmt]||2;
 ideasOf(song).map((x,i)=>({t:x[0],x:x[1],r:hash(song.seed,'idea',song.fmt,i)}))
  .filter(o=>secs.some(s=>s.type===o.t)).sort((a,b)=>a.r-b.r).slice(0,n)
  .forEach(o=>{const c=secs.filter(s=>s.type===o.t);const s=c[Math.floor(hash(song.seed,'occ',o.t)*c.length)];(s.ideas=s.ideas||[]).push(o.x);});
 return {secs,total:start,energy,barInfo};
}

/* Zoom : toutes les positions de la grille sont en calc(var(--bw) * n), donc zoomer = changer une variable */
function applyBw(grid){
 grid.style.setProperty('--bw',S.bw+'px');
 grid.classList.toggle('z-mid',S.bw<9&&S.bw>=4.5);
 grid.classList.toggle('z-lo',S.bw<4.5);
 grid.classList.toggle('nolbl',S.bw<11);
}
function setBw(bw,anchorBar,mx){
 const grid=$('#grid');if(!grid)return;
 S.bw=Math.max(BWMIN,Math.min(BWMAX,bw));
 applyBw(grid);
 grid.scrollLeft=Math.max(0,anchorBar*S.bw+HDW-mx);
}
function centerAnchor(grid){const mx=HDW+(grid.clientWidth-HDW)/2;return {mx,bar:(grid.scrollLeft+mx-HDW)/S.bw};}
function attachPinch(grid){
 let pz=null;
 const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
 grid.addEventListener('touchstart',e=>{
  if(e.touches.length===2){const r=grid.getBoundingClientRect(),mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left;
   pz={d0:dist(e.touches),bw0:S.bw,mx,bar:(grid.scrollLeft+mx-HDW)/S.bw};e.preventDefault();}
 },{passive:false});
 grid.addEventListener('touchmove',e=>{
  if(pz&&e.touches.length===2){e.preventDefault();setBw(pz.bw0*dist(e.touches)/pz.d0,pz.bar,pz.mx);}
 },{passive:false});
 const end=e=>{if(pz&&e.touches.length<2){pz=null;S.pinchAt=Date.now();store.set('arc.bw',S.bw);}};
 grid.addEventListener('touchend',end);grid.addEventListener('touchcancel',end);
 grid.addEventListener('gesturestart',e=>e.preventDefault());
 grid.addEventListener('gesturechange',e=>e.preventDefault());
 // trackpad / ctrl + molette sur ordinateur
 grid.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();const r=grid.getBoundingClientRect(),mx=e.clientX-r.left;setBw(S.bw*Math.exp(-e.deltaY*0.01),(grid.scrollLeft+mx-HDW)/S.bw,mx);store.set('arc.bw',S.bw);},{passive:false});
}
/* Tiroir : glisser gauche / droite = section voisine, haut / bas = ouvrir / fermer */
function attachSheet(sh){
 let s0=null;
 sh.addEventListener('touchstart',e=>{if(e.touches.length!==1){s0=null;return;}const t=e.touches[0];s0={x:t.clientX,y:t.clientY,inMore:!!e.target.closest('.more')};},{passive:true});
 sh.addEventListener('touchend',e=>{
  if(!s0)return;const t=e.changedTouches[0],dx=t.clientX-s0.x,dy=t.clientY-s0.y,inMore=s0.inMore;s0=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)ACT.step(dx<0?1:-1);
  else if(!inMore&&Math.abs(dy)>30&&Math.abs(dy)>Math.abs(dx)*1.5&&(dy<0)!==S.sheet)ACT.sheet();
 },{passive:true});
}

  const prev=pi>0?sel.phrases[pi-1]:(sel.i>0?T.secs[sel.i-1].phrases[T.secs[sel.i-1].phrases.length-1]:null);
  const on=S.sel.bar>=p.start&&S.sel.bar<p.start+p.bars;
  more+=`<div class="ph ${on?'on':''}" data-act="bar" data-v="${p.start}"><div class="pr">${p.bars===1?'Mesure '+(p.start+1):'Mesures '+(p.start+1)+'–'+(p.start+p.bars)}${p.up?' <span class="up">↗ montée</span>':''}</div><div class="pn">${esc(p.note)}</div><div class="tags">${diffTags(prev,p,song.el)}</div></div>`;
 });
 const sheet=`<div class="sheet ${S.sheet?'open':''}" id="sheet">
 <button class="grab" data-act="sheet" aria-label="Afficher ou masquer le détail"><span></span></button>
 <div class="shead"><button class="nav" data-act="step" data-v="-1" ${sel.i>0?'':'disabled'} aria-label="Section précédente">${ic('left',22,2.4)}</button>
  <div class="sinfo"><div class="dh"><span class="dot" style="background:${SEC[sel.type].c}"></span><b>${esc(sel.name)}</b>${sel.loop?'<span class="badge">🔁 ton loop</span>':''}</div>
  <div class="meta">${sel.i+1}/${T.secs.length} · Mesures ${sel.start+1}–${sel.start+sel.bars} · ${fmtT(t0)}–${fmtT(t1)}</div></div>
  <button class="nav" data-act="step" data-v="1" ${sel.i<T.secs.length-1?'':'disabled'} aria-label="Section suivante">${ic('right',22,2.4)}</button></div>
 <div class="srow"><div class="len"><button data-act="len" data-v="-1" aria-label="Raccourcir">${ic('minus',20)}</button><span>${barsTxt(sel.bars)}</span><button data-act="len" data-v="1" aria-label="Rallonger">${ic('plus',20)}</button></div>
  <button class="morebtn" data-act="sheet">Détail${ic('up',20,2.4)}</button></div>
 <div class="more" id="more">${more}</div></div>`;
 $('#view').innerHTML=`<div class="top">
  <div class="strow"><div class="stxt"><small>Structure</small><b>${esc(tpl.n)}</b></div><button class="pill" data-act="regen">${ic('regen',18)}Une autre</button></div>
  <div class="seg big">${FMTS.map(f=>`<button class="${song.fmt===f[0]?'on':''}" data-act="ver" data-v="${f[0]}">${f[1]}<small>${f[2]}</small></button>`).join('')}</div>
 </div>
 <div class="grid" id="grid"><div class="gin" style="width:calc(var(--bw) * ${N} + ${HDW}px)">${g}</div></div>
 <div class="gtools"><div class="seg"><button class="${!full?'on':''}" data-act="mode" data-v="simple">Simple</button><button class="${full?'on':''}" data-act="mode" data-v="full">Complet</button></div><span class="sp"></span>
  <div class="zoomgrp"><button class="ib" data-act="zoom" data-v="-1" aria-label="Dézoomer">${ic('minus',20)}</button><button class="ib" data-act="fit" aria-label="Tout afficher">${ic('fit',20)}</button><button class="ib" data-act="zoom" data-v="1" aria-label="Zoomer">${ic('plus',20)}</button></div></div>
 ${sheet}`;
 const grid=$('#grid');
 applyBw(grid);attachPinch(grid);attachSheet($('#sheet'));
 grid.scrollLeft=oldLeft;
 if(S.sel.sec===S.lastSec)$('#more').scrollTop=omTop;
 S.lastSec=S.sel.sec;
 if(S._fit){S._fit=false;ACT.fit();}
 if(S._scrollTo){const x=S.sel.bar*S.bw,vw=grid.clientWidth-HDW;if(x<grid.scrollLeft||x>grid.scrollLeft+vw-20)grid.scrollLeft=Math.max(0,x-vw/3);S._scrollTo=false;}
}

function selectBar(bar,scroll){const T=S.T;bar=Math.max(0,Math.min(T.total-1,bar));S.sel.bar=bar;S.sel.sec=T.barInfo[bar].s;S._scrollTo=!!scroll;render();}

function newSong(seedOnly){
 const P=S.params;
 if(!seedOnly){S.song={style:P.style,flavor:P.flavor||null,bpm:P.bpm,el:clone(P.el),loop:clone(P.loop),fmt:P.fmt,versions:{}};}
 const prev=seedOnly&&S.song.seed?tplOf(S.song).n:null,pool=poolOf(S.song);
 for(let t=0;t<20;t++){S.song.seed=Math.random().toString(36).slice(2,10);if(!prev||pool.length<2||tplOf(S.song).n!==prev)break;}
 S.song.versions={};delete S.song.savedId;
 S.sel={sec:0,bar:0};curVer();persist();
}
function go(view){const same=S.view===view;S.view=view;render();window.scrollTo(0,0);return same;}

const ACT={
 style(v){S.params.style=v;S.params.flavor='';S.params.bpm=FAM[v].bpm;persist();render();},
 flavor(v){S.params.flavor=v;S.params.bpm=v?FLAV[v].bpm:FAM[S.params.style].bpm;persist();render();},
 bpm(v){const P=S.params;P.bpm=Math.max(60,Math.min(200,P.bpm+ +v));$('#bpm').value=P.bpm;persist();},
 fmt(v){S.params.fmt=v;persist();render();},
 el(v){S.params.el[v]=!S.params.el[v];persist();render();},
 loop(v){S.params.loop.type=v;persist();render();},
 looplen(v){S.params.loop.len=+v;persist();render();},
 generate(){const inp=$('#bpm');if(inp){S.params.bpm=Math.max(60,Math.min(200,Math.round(+inp.value||S.params.bpm)));}
  if(!ORDER.some(e=>S.params.el[e])){toast('Coche au moins un élément');return;}
  newSong(false);S.sheet=false;S._fit=true;go('arrange');},
 regen(){newSong(true);S._fit=true;render();toast('Structure : '+tplOf(S.song).n);},
 ver(v){S.song.fmt=v;S.sel={sec:0,bar:0};S._fit=true;persist();render();},
 mode(v){S.mode=v;render();},
 zoom(v){const grid=$('#grid');if(!grid)return;const a=centerAnchor(grid);setBw(S.bw*(+v>0?1.5:1/1.5),a.bar,a.mx);store.set('arc.bw',S.bw);},
 fit(){const grid=$('#grid');if(!grid||!S.T)return;setBw((grid.clientWidth-HDW-6)/S.T.total,0,HDW);store.set('arc.bw',S.bw);},
 len(v){const s=curVer().sections[S.sel.sec],step=s.loop?S.song.loop.len:4,nb=s.bars+(+v)*step;if(nb<step||nb>128)return;s.bars=nb;persist();render();},
 bar(v){selectBar(+v,true);},
 step(v){const T=S.T,n=S.sel.sec+ +v;if(!T||n<0||n>=T.secs.length)return;selectBar(T.secs[n].start,true);},
 sheet(){S.sheet=!S.sheet;const sh=$('#sheet');if(sh)sh.classList.toggle('open',S.sheet);},
 setup(){go('setup');},
 saved(){go('saved');},
 back(){if(S.song)go('arrange');},
 save(){
  const L=store.get('arc.saved',[]),song=S.song,ent=song.savedId&&L.find(x=>x.id===song.savedId);
  if(ent){ent.song=clone(song);ent.date=Date.now();store.set('arc.saved',L);persist();toast('Sauvegarde mise à jour');return;}
  ask('Nommer cette structure',`${titleOf(song)} · ${song.bpm} BPM`,'Sauver',name=>{
   const L=store.get('arc.saved',[]);song.savedId=Date.now().toString(36);
   L.unshift({id:song.savedId,name:name.trim()||'Sans titre',date:Date.now(),song:clone(song)});
   store.set('arc.saved',L);persist();toast('Sauvegardé');});
 },
 open(v){const x=store.get('arc.saved',[]).find(x=>x.id===v);if(!x)return;S.song=migrate(clone(x.song));S.song.savedId=x.id;S.sel={sec:0,bar:0};S.sheet=false;S._fit=true;persist();go('arrange');},
 // suppression immédiate, avec « Annuler » dans le toast plutôt qu'une confirmation
 del(v){
  const L=store.get('arc.saved',[]),i=L.findIndex(x=>x.id===v);if(i<0)return;
  const x=L.splice(i,1)[0],wasOpen=!!(S.song&&S.song.savedId===v);
  store.set('arc.saved',L);if(wasOpen)delete S.song.savedId;persist();render();
  toast('« '+x.name+' » supprimé',{label:'Annuler',fn(){const L=store.get('arc.saved',[]);L.splice(Math.min(i,L.length),0,x);store.set('arc.saved',L);if(wasOpen&&S.song)S.song.savedId=v;persist();render();}});
 }
};

/* Maintien sur − / + : un appui = un pas, appui long = défilement */
let hold=null;
document.addEventListener('pointerdown',e=>{
 const b=e.target.closest('[data-hold]');if(!b)return;
 const run=()=>ACT[b.dataset.act](b.dataset.v),h=hold={b,rep:false};
 h.t=setTimeout(()=>{h.rep=true;run();h.iv=setInterval(run,70);},400);
});
const endHold=e=>{if(!hold)return;const h=hold;hold=null;clearTimeout(h.t);clearInterval(h.iv);if(e.type==='pointerup'&&!h.rep&&h.b.contains(e.target))ACT[h.b.dataset.act](h.b.dataset.v);};
document.addEventListener('pointerup',endHold);document.addEventListener('pointercancel',endHold);

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');
 if(b){if(b.hasAttribute('data-hold')&&e.detail!==0)return;const f=ACT[b.dataset.act];if(f)f(b.dataset.v,b,e);return;}
 if(Date.now()-S.pinchAt<400)return;
 const lane=e.target.closest('#grid .lane');
 if(lane&&S.T){const r=lane.getBoundingClientRect();selectBar(Math.floor((e.clientX-r.left)/S.bw),false);}
});
render();
</script>
</body>
</html>
